services:
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - 9080:80
      - 9443:443
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html
    networks:
      - web
    depends_on:
      - php
  
  cloudflare:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    env_file: .env
    networks:
    - web

  php:
    image: php:8.3-fpm
    container_name: php_mailing
    restart: always
    volumes:
      - ./site:/usr/share/nginx/html
      - ./local:/var/www/donnees_locales
    networks:
      - web

networks:
  web:
    driver: bridge