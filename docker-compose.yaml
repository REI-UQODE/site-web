services:
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - 9080:80
      - 9443:443
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html
      - ./.well-known:/var/www/.well-known
    networks:
      - defi-oct2026
      - interne
    depends_on:
      - php
  
  cloudflare:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    env_file: .env
    networks:
    - interne
    - web

  php:
    image: php:8.3-fpm
    container_name: php_mailing
    restart: always
    volumes:
      - ./site:/usr/share/nginx/html
      - ./local:/var/www/donnees_locales
    networks:
      - interne

networks:
  interne:
    internal: true
  web:
    driver: bridge
  defi-oct2026:
    ipam:
      config:
        - subnet: 172.30.10.0/24