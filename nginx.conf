server{
	listen 80;
	server_name uctf.rei-uqode.ca;

	location / {
		return 301 https://rei-uqode.ca/pages/activites.html;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name rei-uqode.ca;

	root /usr/share/nginx/html;

	location / {
		# root /usr/share/nginx/html;
		index index.html;
	}
	
	location ~ \.php {
		# root html;
		try_files $uri =404;
		fastcgi_pass php:9000;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		include fastcgi_params;
	}

	location ^~ /.well-known/ {
		default_type application/json;
        rewrite \/\.well-known/(.*)$ /$1.json break;
		root /var/www/.well-known/;		
	}

	location @defi-oct2026 {
		proxy_pass http://172.30.10.1:5000;
	}

	location ^~ /defi-oct2026/api/ {
		rewrite \/defi-oct2026/api/(.*)$ /$1 break;

		try_files /dev/null @defi-oct2026;
	}
}